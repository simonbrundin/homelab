apiVersion: apps/v1
kind: Deployment
metadata:
  name: suggestarr
  namespace: suggestarr
  labels:
    app.kubernetes.io/name: suggestarr
    app.kubernetes.io/instance: suggestarr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: suggestarr
      app.kubernetes.io/instance: suggestarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: suggestarr
        app.kubernetes.io/instance: suggestarr
    spec:
      containers:
        - name: suggestarr
          image: ghcr.io/ciuse99/suggestarr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            # Port must match SUGGESTARR_PORT inside container
            - name: SUGGESTARR_PORT
              value: "5000"
            # Jellyfin configuration (configured via web UI)
            - name: JELLYFIN_HOST
              value: "http://jellyfin.jellyfin.svc.cluster.local:8096"
            # Jellyseerr configuration (configured via web UI)
            - name: JELLYSEERR_HOST
              value: "http://jellyseerr.jellyseerr.svc.cluster.local:3333"
            # SQLite database stored in config volume
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/config/config_files
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: suggestarr-config
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
