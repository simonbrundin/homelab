apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart
  namespace: stalwart
spec:
  interval: 10m
  chart:
    spec:
      chart: stalwart
      version: "0.2.8"
      sourceRef:
        kind: HelmRepository
        name: stalwart
        namespace: stalwart
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: stalwartlabs/stalwart
      tag: "v0.16.24"

    replicaCount: 1

    # Recovery admin - password stored in SOPS (see admin-secret.yaml)
    recoveryAdmin:
      enabled: true
      username: admin
      existingSecret: "stalwart-admin-secret"

    # RocksDB for local storage (simple and efficient for homelab)
    # PostgreSQL can be configured later for multi-node setups
    config:
      "@type": RocksDb
      path: /var/lib/stalwart

    # Persistent storage on Longhorn
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      storageClass: longhorn-single-replica
      size: 10Gi

    service:
      type: ClusterIP
      ports:
        smtp: 25
        smtps: 465
        submission: 587
        imap: 143
        imaps: 993
        sieve: 4190
        http: 80
        https: 443
        mgmt: 8080

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    podSecurityContext:
      fsGroup: 2000
      runAsUser: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
