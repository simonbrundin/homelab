apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  values:
    # Use configuration file instead of env vars (v3.0.0 requirement)
    existingConfiguration: immich-config
    # Server component
    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              # Add extra env vars using extraEnv
              extraEnv:
                - name: DB_HOSTNAME
                  value: immich-db-rw
                - name: DB_USERNAME
                  value: immich
                - name: DB_DATABASE_NAME
                  value: immich
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-app
                      key: password
    # Machine learning component
    machine-learning:
      enabled: true
    # Data persistence (library photos)
    immich:
      persistence:
        library:
          existingClaim: immich-library
    # Redis/valkey for job queues
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          size: 1Gi
          accessMode: ReadWriteOnce
          type: persistentVolumeClaim
  install:
    createNamespace: true
    timeout: 10m
  upgrade:
    timeout: 10m
