apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  values:
    # Use configuration file for main settings
    existingConfiguration: immich-config
    # Shared controller settings with DB env vars from secret
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.2.2
            env:
              DB_HOSTNAME:
                value: immich-db-rw
              DB_USERNAME:
                value: immich
              DB_DATABASE_NAME:
                value: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: password
            resources:
              requests:
                cpu: 1m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
    # Server component
    server:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1
                  memory: 2Gi
    # Machine learning component
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: 1
                  memory: 2Gi
    # Data persistence (library photos)
    immich:
      persistence:
        library:
          existingClaim: immich-library
    # Redis/valkey for job queues
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          size: 1Gi
          accessMode: ReadWriteOnce
          type: persistentVolumeClaim
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 1m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
  install:
    createNamespace: true
    timeout: 10m
  upgrade:
    timeout: 10m
