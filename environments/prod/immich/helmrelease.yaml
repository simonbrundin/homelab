apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  values:
    # Use configuration file for main settings
    existingConfiguration: immich-config
    # Shared controller settings with DB env vars from secret
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME:
                value: immich-db-rw
              DB_USERNAME:
                value: immich
              DB_DATABASE_NAME:
                value: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: password
    # Server component
    server:
      enabled: true
    # Machine learning component
    machine-learning:
      enabled: true
    # Data persistence (library photos)
    immich:
      persistence:
        library:
          existingClaim: immich-library
    # Redis/valkey for job queues
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          size: 1Gi
          accessMode: ReadWriteOnce
          type: persistentVolumeClaim
  install:
    createNamespace: true
    timeout: 10m
  upgrade:
    timeout: 10m
