apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
  namespace: calibre-web-automated
  labels:
    app.kubernetes.io/name: calibre-web-automated
    app.kubernetes.io/instance: calibre-web-automated
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web-automated
      app.kubernetes.io/instance: calibre-web-automated
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web-automated
        app.kubernetes.io/instance: calibre-web-automated
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 0
      initContainers:
        - name: init-db
          image: crocodilestick/calibre-web-automated:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # Create anonymous user if not exists
              if ! sqlite3 /config/app.db \
                "SELECT 1 FROM user WHERE role & 32 = 32" \
                | grep -q 1; then
                echo "Creating anonymous user..."
                sqlite3 /config/app.db \
                  "INSERT INTO user (name,email,role) VALUES (NULL,NULL,32);"
              fi
              echo "Database initialized"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: calibre-web-automated
          image: crocodilestick/calibre-web-automated:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Stockholm"
            - name: NETWORK_SHARE_MODE
              value: "false"
            - name: CWA_PORT_OVERRIDE
              value: "8083"
            - name: CWA_UPLOAD_FOLDER
              value: "/books"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: library
              mountPath: /calibre-library
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cwa-config
        - name: books
          persistentVolumeClaim:
            claimName: shelfmark-books
        - name: library
          persistentVolumeClaim:
            claimName: cwa-library
