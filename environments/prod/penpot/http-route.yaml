apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: penpot-route
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot
spec:
  parentRefs:
    - name: simons-gateway
      namespace: envoy
  hostnames:
    - "design.simonbrundin.com"
  rules:
    # MCP routes
    - backendRefs:
        - group: ""
          kind: Service
          name: penpot-mcp
          port: 4401
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /mcp
    # Main Penpot route
    - backendRefs:
        - group: ""
          kind: Service
          name: penpot
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
