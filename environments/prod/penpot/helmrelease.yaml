apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot
  namespace: penpot
spec:
  interval: 5m
  chart:
    spec:
      chart: penpot
      sourceRef:
        kind: HelmRepository
        name: penpot
        namespace: flux-system
  values:
    config:
      existingSecret: penpot-credentials
      secretKeys:
        apiSecretKey: api-secret-key
      postgresql:
        host: penpot-db-rw
        database: app
        username: app
        existingSecret: penpot-db-app
        secretKeys:
          passwordKey: password
      redis:
        host: penpot-redis
        port: 6379
        database: 0
      publicUri: "https://design.simonbrundin.com"
      flags: >
        enable-registration
        enable-login-with-password
        disable-email-verification
        enable-smtp
        enable-mcp
    persistence:
      assets:
        enabled: true
        existingClaim: penpot-assets
    global:
      postgresqlEnabled: false
      valkeyEnabled: false
    backend:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    frontend:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
    exporter:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
  install:
    createNamespace: true
    timeout: 10m
  upgrade:
    timeout: 10m
