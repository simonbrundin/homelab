apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: penpot-redis
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-single-replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: penpot-redis
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot
    app.kubernetes.io/instance: penpot-redis
spec:
  replicas: 1
  serviceName: penpot-redis
  selector:
    matchLabels:
      app.kubernetes.io/name: penpot
      app.kubernetes.io/instance: penpot-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: penpot
        app.kubernetes.io/instance: penpot-redis
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: penpot-redis
---
apiVersion: v1
kind: Service
metadata:
  name: penpot-redis
  namespace: penpot
  labels:
    app.kubernetes.io/name: penpot
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: penpot
    app.kubernetes.io/instance: penpot-redis
