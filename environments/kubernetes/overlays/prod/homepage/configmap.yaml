apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Kubernetes:
        - Grafana:
            icon: grafana.png
            href: http://grafana.simonbrundin.com
            siteMonitor: http://grafana.simonbrundin.com
            description: Dashboardarnas dashboard
        - pgAdmin:
            icon: pgadmin.png
            href: http://pgadmin.simonbrundin.com
            siteMonitor: http://pgadmin.simonbrundin.com
            description: Hantera Postgres-databaser
        - Longhorn:
            icon: longhorn.png
            href: http://longhorn.simonbrundin.com
            siteMonitor: http://longhorn.simonbrundin.com
            description: Lagring i Kubernetes

    - Egenutvecklat:
        - Plan:
            href: http://plan.simonbrundin.com
            siteMonitor: http://plan.simonbrundin.com
            description: Världens bästa planeringsapp 😎
    - Infra:
        - Unifi:
            href: https://unifi.ui.com/consoles/0CEA145690E500000000087652220000000008E9B7670000000067253CC5:1407354649/network/default/clients/main
            icon: unifi.png
            description: Min älskade gateway
    - Monitoring:
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: https://uptime.simonbrundin.com
            siteMonitor: https://uptime.simonbrundin.com
            description: Monitor homelab service uptime
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://tv.simonbrundin.com
            siteMonitor: https://tv.simonbrundin.com
            description: Film och serier
        - SuggestArr:
            icon: suggestion.png
            href: https://suggest.simonbrundin.com
            siteMonitor: https://suggest.simonbrundin.com
            description: Automatiska mediarekommendationer
        - Jellyseerr:
            icon: request.png
            href: https://seerr.simonbrundin.com
            siteMonitor: https://seerr.simonbrundin.com
            description: Begär media
  widgets.yaml: |
    - search:
        provider: duckduckgo
        target: _blank
